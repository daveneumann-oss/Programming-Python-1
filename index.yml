  - path: course1/unit1/lesson2/lessonpart1/MyOracle.py
    content: "# this imports a library called \"random\" which has \r

      # all sorts of cool functions like making \r

      # random numbers...\r

      import random\r

      \r

      # This is a variable assignment to a variable called\r

      # 'responses'. Note that we're shoving in more than 1 string\r

      # into the 'responses' variable! This is called a list, so there\r

      # are 6 strings inside responses. We can get them out by\r

      # referencing their index number. A list is automatically indexed\r

      # starting with 0 when you create it.\r

      responses = [\r

      \    \"Yes, definitely!\", # index = 0\r

      \    \"No, not at all.\", # index = 1\r

      \    \"Ask again later.\"\r

      ]\r

      \r

      # if we want the program to end, we shouldn't use\r

      # an infinite loop (while True:). How to change?\r

      while True:\r

      \    question = input(\"Ask the Oracle a question (or type 'quit' to
      exit): \")\r

      \    if question.lower() == 'quit':\r

      \        print(\"Goodbye!\")\r

      \        # Oooh....I don't like 'break' as a command\r

      \        # unless we absolutely need it (we don't)\r

      \        break\r

      \    else:\r

      \        print(random.choice(responses))"
