  - path: course1/unit1/lesson1/lessonpart2/PythonExample2.py
    content: "# A comment, this is so you can read your program later.\r

      # Anything after the # is ignored by python.\r

      \r

      print(\"I will now count my chickens:\") #You can even write them after a
      line!\r

      \r

      # this paragraph below is also a comment because it's\r

      # between ''' and '''. Crazy!\r

      \r

      '''regarding math...python uses PEMDAS, but does all\r

      multiplication/division in order from left to right. \r

      Same with addition and subtraction. So, in Python, \r

      PEMDAS looks like this: PE(M&D)(A&S) (Also, note\r

      this way of denoting a LOOOOOONNNNG comment. \r

      Cool, eh?)'''\r

      \r

      print(\"Hens\", 25 + 30 / 6)\r

      # The % sign isn't 'percent', it's modulo. \r

      # modulo = the remainder after division\r

      print(\"Roosters\", 100 - 25 * 3 % 4)\r

      print(\"Now I will count the eggs:\")\r

      print(3 + 2 + 1 - 5 + 4 % 2 - 1 / 4 + 6)\r

      print(\"Is it true that 3 + 2 < 5 - 7?\")\r

      print(3 + 2 < 5 - 7) #ooh! what happens here?\r

      \r

      print(\"What is 3 + 2?\", 3 + 2) #what happens in these 2 lines?\r

      print(\"What is 5 - 7?\", 5 - 7)\r

      \r

      print(\"Oh, that's why it's False.\")\r

      \r

      print(\"How about some more.\")\r

      \r

      # The following all output text and True or False\r

      # (someting that can only be True or False is what we\r

      # call a Boolean in coding.)\r

      print(\"Is it greater?\", 5 > -2)\r

      print(\"Is it greater or equal?\", 5 >= -2)\r

      print(\"Is it less or equal?\", 5 <= -2)"
  - path: course1/unit1/lesson1/lessonpart3/PythonExercise3.py
    content: "# Lines 4-11 are all variable assignments! Note you \r

      # can assign variables to other variables or do math\r

      # with variables and then assign that, too!\r

      cars = 100\r

      space_in_a_car = 4.0\r

      drivers = 30\r

      passengers = 90\r

      cars_not_driven = cars - drivers\r

      cars_driven = drivers\r

      carpool_capacity = cars_driven * space_in_a_car\r

      average_passengers_per_car = passengers / cars_driven\r

      # Note on all the variable assignments above how we put\r

      # spaces around the '=' and math operators. You don't have\r

      # to do that, but it's good practice. If you don't, real\r

      # software nerds will know you're a poser. Don't be a \r

      # poser!\r

      \r

      print(\"There are\", cars, \"cars available.\")\r

      print(\"There are only\", drivers, \"drivers available.\")\r

      print(\"There will be\", cars_not_driven, \"empty cars today.\")\r

      print(\"We can transport\", carpool_capacity, \"people today.\")\r

      print(\"We have\", passengers, \"to carpool today.\")\r

      print(\"We need to put about\", average_passengers_per_car,\r

      \"in each car.\")"
  - path: course1/unit1/lesson1/lessonpart4/PythonExercise4.py
    content: "# note these two variables are Booleans set to True\r

      not_dead = True\r

      not_insane = True\r

      \r

      # The conditional statement has to be true for the while\r

      # loop to run all the stuff indented underneath it. \r

      # Note how we use booleans directly to make the condition\r

      # True or False. (AND is a boolean operator...we'll talk)\r

      # more about this later when we get into some boolean math.\r

      while not_dead and not_insane:\r

      \r

      \    # if the print statement below is in your console, \r

      \    # that means we're inside the while loop! using print\r

      \    # statements like this is great for debugging if a \r

      \    # loop or if/else is working the way you want.\r

      \    print(\"\"\"You enter a dark room with two doors.\r

      \    Do you go through door #1 or door #2?\"\"\")\r

      \r

      \    # The variable below is assigned an input statement.\r

      \    # That means the computer will ask for the user to type\r

      \    # in a value and assign that value to the variable. We'll\r

      \    # use these a lot in your \"oracle\" program.\r

      \    door = input(\"> \")\r

      \r

      \    # Our first if/elif/else statement. Note that everything\r

      \    # indented under line 27 will run if door == 1 is true.\r

      \    if door == \"1\":\r

      \        print(\"There's a giant bear here eating a cheesecake.\")\r

      \        print(\"What do you do?\")\r

      \        print(\"1. Take the cake.\")\r

      \        print(\"2. Scream at the bear.\")\r

      \r

      \        bear = input(\"> \")\r

      \        # Whoa! an if inside an if? Yep, we call these\r

      \        # nested if statements. You can do this as many\r

      \        # times as you like, but your code will get \r

      \        # exponentially more and more confusing the more\r

      \        # nested if/else statements you have so try to cap\r

      \        # it at 3 or 4 at the very most!\r

      \        if bear == \"1\":\r

      \            print(\"The bear eats your face off. Good job!\")\r

      \            not_dead = False\r

      \        # what the hell is an elif? Basically, this allows\r

      \        # your if/else to have more than just 2 answers! Think\r

      \        # of it as \"else, if\"\r

      \        elif bear == \"2\":\r

      \            print(\"The bear eats your legs off. Good job!\")\r

      \            not_dead = False\r

      \        else:\r

      \            print(f\"Well, doing {bear} is probably better.\")\r

      \            print(\"Bear runs away.\")\r

      \    elif door == \"2\":\r

      \        print(\"You stare into the endless abyss at Cthulhu's
      retina.\")\r

      \        print(\"1. Blueberries.\")\r

      \        print(\"2. Yellow jacket clothespins.\")\r

      \        print(\"3. Understanding flowers screaming melodies.\")\r

      \        insanity = input(\"> \")\r

      \r

      \        # 'or' is another boolean operator. :)\r

      \        if insanity == \"1\" or insanity == \"2\":\r

      \            print(\"Your body survives powered by a mind of jello.\")\r

      \            print(\"Good job!\")\r

      \            not_insane = False\r

      \        else:\r

      \            print(\"The insanity rots your eyes into a pool of muck.\")\r

      \            print(\"Good job!\")\r

      \            not_insane = False\r

      \r

      \    else:\r

      \        print(\"You stumble around and fall on a knife and die. Good
      job!\")\r

      \        not_dead = False\r

      \r

      # this isn't needed but otherwise it's hard to tell\r

      # if the program reached the end or got stuck in the\r

      # while loop somewhere. So, basically, this is a print\r

      # statment used only for debugging the code and not\r

      # needed for the code actual operation.\r

      print(\"That the end, folks!\")"
