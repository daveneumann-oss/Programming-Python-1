id: lessonpart2
title: Math (and how to print it)
content: >+
  In this lesson, we're going to explore how to use math in Python. It's
  unavoidable, but luckily all we have to do is know an equation and the
  computer will then do all the math for us. 


  ### PEMDAS?


  In the United States we use an acronym called PEMDAS which stands for
  Parentheses Exponents Multiplication Division Addition Subtraction. That’s the
  order Python follows as well. The mistake people make with PEMDAS is to think
  this is a strict order, as in ”Do P, then E, then M, then D, then A, then S.”
  The actual order is you do the multiplication and division (M\&D) in one step,
  from left to right, then you do the addition and subtraction in one step from
  left to right. So, you could rewrite PEMDAS as PE(M\&D)(A\&S). This is how
  Python handles math, too, so watch the long math equations we have and try to
  figure out what to expect before hitting the run button!


  ### Example


  Let's start with a simple example:


  ```python

  # Math!

  print(3 + 2 * 5 / 2 + 3 - 1 * 8)


  # what number do you expect to print?

  ```


  In this example, we are printing a number to the console but, instead of
  explicitly stating the number, we're letting the PC do the math. The answer
  would be 3. Is that what you got?


  ### Using Math in Print Statements


  Notice all the ways you can print math directy to the console.


  ```python

  print("Roosters", 100 - 25 * 3 % 4)

  print("Now I will count the eggs:")

  print(3 + 2 + 1 - 5 + 4 % 2 - 1 / 4 + 6)

  print("Is it true that 3 + 2 < 5 - 7?")

  print(3 + 2 < 5 - 7) #ooh! what happens here?

  ```


  Note in the first line we print a string and the result of a math equation in
  the same print statement by separating them with a comma (but both within the
  print function's parentheses). 


  The second and third line do the same thing, except they print on separate
  lines because they are two separate print statements. 


  What is going to print with the last line???


  ### Instructions


  * Press the run button and examine the output. 


  * Try to figure out the rules for what gets printed and how. For example, some
  lines output "True" or "False". Why?


  * Read the Comments in the code! They will give you ideas about what and why
  things are like they are!

